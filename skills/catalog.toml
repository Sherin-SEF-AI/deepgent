# Skill catalog (expansion spec A3). THE MAP, NOT LOADABLE CONTENT.
#
# This manifest is data, not a skill pack: it has no SKILL.md, so the harness
# never loads it into agent context. It records every catalog entry with its
# tier and the paired golden it must have before it can merge (WO-16 gate).
#
# status: 'present' = a SKILL.md pack of that exact id exists on disk;
#         'planned' = not authored. golden = '' means no paired golden yet, so
# the entry is NOT yet mergeable under the Part A3 contract (no golden, no
# merge). Authoring is one skill per session, T0 first, each with its golden
# and owner review. Never fabricate a hardware fact: carry provenance or mark
# it unverified (CLAUDE.md section 1).

[meta]
total = 65
tier_counts = { T0 = 11, T1 = 24, T2 = 25, T3 = 5 }

