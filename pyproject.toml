[project]
name = "deepgent"
version = "0.1.1"
description = "Domain-locked autonomous engineering agent for autonomous vehicles, computer vision, and embedded systems"
readme = "README.md"
authors = [{ name = "Sherin Joseph Roy" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "asyncssh>=2.24.0",
    "claude-agent-sdk==0.2.125",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "tomli-w>=1.2.0",
    "typer>=0.27.0",
    "rich>=13.0",
    "mcp>=1.2",
]

[project.urls]
Repository = "https://github.com/Sherin-SEF-AI/deepgent"

[project.scripts]
deepgent = "deepgent.cli:app"
dg = "deepgent.cli:app"
deepgent-gui = "deepgent.gui.app:launch"

[project.optional-dependencies]
gui = [
    "pyside6>=6.7",
    "qasync>=0.27",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.14",
    "pytest>=8.3",
    "types-pyyaml>=6.0.12.20260518",
]
server = [
    "deepgent-server",
    "fastapi>=0.139.2",
    "pypdf>=6.14.2",
    "uvicorn>=0.51.0",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["server"]

[tool.uv.sources]
deepgent-server = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.mypy]
strict = true
files = ["src", "server"]
python_version = "3.12"

[[tool.mypy.overrides]]
# PySide6 subclassing and Signal/Slot decorators are Any-typed in the stubs;
# relax the strictest checks for the Qt view layer only. Controllers stay strict.
module = "deepgent.gui.*"
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
# qasync ships no type stubs / py.typed marker.
module = "qasync"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: fast, isolated tests with no external dependencies",
    "integration: tests that touch containers, networks, or external services",
    "hardware: tests that require a leased target board; run only via the board runner workflow",
]
