# Single source of truth for external stack versions. Code and docs read from
# this file; nothing hardcodes a version string. Seeded 2026-07-22 (verified).
# On any change: rebuild containers and run the full golden suite before merge.

[jetson.jp6]           # production line for AGX Orin targets
jetpack = "6.2"
l4t = "36.4.3"
cuda = "12.6"
tensorrt = "10.3"
cudnn = "9.3"

[jetson.jp7]           # newer line; not used until a target requires it
jetpack = "7.2"
l4t = "39.2"
cuda = "13.2.1"
tensorrt = "10.16.2"

[ros2]
default = "jazzy"      # containerized; mature ecosystem on Ubuntu 24.04
lts_latest = "lyrical" # released 2026-05, Ubuntu 26.04; adopt via containers
                       # only after goldens pass on it
jp6_native = "humble"  # L4T r36 rootfs is Ubuntu 22.04

[deepstream]
version = "pinned-per-container"  # resolve against JetPack at container build,
                                  # verify with a smoke golden, record actual

[models]               # model IDs per routing tier (section 9); code reads
                       # these via config, never hardcodes them
opus = "claude-opus-4-8"
sonnet = "claude-sonnet-5"
haiku = "claude-haiku-4-5"
