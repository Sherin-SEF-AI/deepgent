[project]
name = "deepgent-server"
version = "0.1.0"
description = "deepgent knowledge API server (private; not for PyPI)"
requires-python = ">=3.12"
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "fastapi>=0.121",
    "uvicorn>=0.51",
    "pypdf>=6.14",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "deepgent_server"
module-root = ""
